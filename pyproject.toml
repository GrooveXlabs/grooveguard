[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grooveguard"
version = "1.0.0"
description = "Enterprise Python security scanner with AST analysis, CWE mapping, and CI/CD integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "GrooveXlabs", email = "security@groovexlabs.com"}
]
keywords = [
    "security", "scanner", "sast", "static-analysis", "python",
    "cwe", "owasp", "ast", "secret-detection", "ci-cd"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]

[project.scripts]
grooveguard = "grooveguard.cli:main"

[project.urls]
Homepage = "https://github.com/GrooveXlabs/grooveguard"
Documentation = "https://github.com/GrooveXlabs/grooveguard#readme"
Repository = "https://github.com/GrooveXlabs/grooveguard.git"
Issues = "https://github.com/GrooveXlabs/grooveguard/issues"

[tool.pytest.ini_options]
testpaths = ["grooveguard/tests"]
pythonpath = ["."]
addopts = "-v --tb=short --cov=grooveguard --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
